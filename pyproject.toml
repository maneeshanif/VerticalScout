[project]
name = "verticalgate"
version = "0.1.0"
description = "Elite Member Collection & AI Domain Evaluation Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # OpenAI Agents SDK + LiteLLM for Gemini & OpenRouter
    "openai-agents[litellm]>=0.0.19",
    "litellm>=1.50.0",
    # Sentry with OpenAI Agents integration
    "sentry-sdk[fastapi]>=2.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
