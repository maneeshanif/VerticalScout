version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: verticalgate-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./docs:/app/docs
    restart: unless-stopped
    networks:
      - verticalgate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verticalgate-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - verticalgate-network

networks:
  verticalgate-network:
    driver: bridge
